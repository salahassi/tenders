pid /tmp/nginx.pid;
error_log /dev/stderr error;
worker_processes auto;
events { worker_connections 1024; }
http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 12m;
  proxy_connect_timeout 5s;
  proxy_read_timeout 150s;
  proxy_send_timeout 150s;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

  # Public SDK-compatible interface. Worker identities never pass this server.
  server {
    listen 8080;
    server_name _;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location ~ ^/functions/v1/(worker|source-browser)(/|$) { return 404; }
    location /auth/v1/ { set $upstream http://auth.__NAMESPACE__.svc.cluster.local:9999; rewrite ^/auth/v1/(.*)$ /$1 break; proxy_pass $upstream; }
    location /rest/v1/ { set $upstream http://rest.__NAMESPACE__.svc.cluster.local:3000; rewrite ^/rest/v1/(.*)$ /$1 break; proxy_pass $upstream; }
    location /storage/v1/ { set $upstream http://storage.__NAMESPACE__.svc.cluster.local:5000; rewrite ^/storage/v1/(.*)$ /$1 break; proxy_pass $upstream; }
    location /functions/v1/api/ { set $upstream http://api.__NAMESPACE__.svc.cluster.local:8080; proxy_pass $upstream; }
    location /functions/ { return 404; }
    location / { set $upstream http://frontend.__NAMESPACE__.svc.cluster.local:8080; proxy_pass $upstream; }
  }

  # Cluster-only interface, never a target of the public LoadBalancer service.
  server {
    listen 8081;
    server_name _;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location /auth/v1/ { set $upstream http://auth.__NAMESPACE__.svc.cluster.local:9999; rewrite ^/auth/v1/(.*)$ /$1 break; proxy_pass $upstream; }
    location /rest/v1/ { set $upstream http://rest.__NAMESPACE__.svc.cluster.local:3000; rewrite ^/rest/v1/(.*)$ /$1 break; proxy_pass $upstream; }
    location /storage/v1/ { set $upstream http://storage.__NAMESPACE__.svc.cluster.local:5000; rewrite ^/storage/v1/(.*)$ /$1 break; proxy_pass $upstream; }
    location /functions/v1/api/ { set $upstream http://api.__NAMESPACE__.svc.cluster.local:8080; proxy_pass $upstream; }
    location /functions/v1/worker { set $upstream http://worker.__NAMESPACE__.svc.cluster.local:8080; proxy_pass $upstream; }
    location /functions/v1/source-browser { set $upstream http://source-browser.__NAMESPACE__.svc.cluster.local:8080; proxy_pass $upstream; }
    location / { return 404; }
  }
}
