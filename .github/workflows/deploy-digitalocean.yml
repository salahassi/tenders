name: Deploy TenderDesk to DigitalOcean

on:
  workflow_dispatch:
  push:
    branches: [codex/doks-production]
    paths-ignore: ['**/*.md']

permissions:
  contents: read

concurrency:
  group: tenderdesk-digitalocean-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install both locked packages and the pinned private-transfer dependency
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          python3 -m pip install --requirement backend/scripts/ops/private-transfer-requirements.txt
      - name: Verify application and deployment guards
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend test -- --maxWorkers=1
          npm --prefix frontend run build
          npm --prefix backend run typecheck
          npm --prefix backend test -- --maxWorkers=1
          npm --prefix backend run build
          python3 -m unittest discover -s backend/scripts/ops -p 'test_*.py'
          python3 -m unittest discover -s backend/scripts/ops/production-schema -p 'test_*.py'
          python3 -m unittest discover -s backend/deploy/kubernetes -p 'test_*.py'
          node backend/node_modules/vitest/vitest.mjs run --root backend scripts/runtime/scheduler.test.ts --maxWorkers=1
          node backend/scripts/runtime/test-dispatcher.mjs
          node backend/scripts/runtime/test-auth-invitations.mjs
          node backend/deploy/kubernetes/test_setup.mjs
      - name: Prepare verified cluster access and expiring image-push credentials
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/digitalocean-runner.py
      - name: Download the encrypted first-owner bundle into private runner storage
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          python3 backend/scripts/ops/private-transfer.py \
            --download "${DOKS_WORKDIR}/migration.tar.gz" \
            --bucket tenderdesk-migration-a6093a76-sfo3 \
            --object bootstrap/first-owner-20261026-v1.bundle \
            --expected-sha256 37de57604b2afc46d6363efa64cc70a8242c07c856f1b0659fa5496697818484
      - name: Build and publish immutable runtime and frontend images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, sys
          registry = 'registry.digitalocean.com/tenderdesk-a6093a76/'
          directory = pathlib.Path(os.environ['DOKS_WORKDIR'])
          entries = [
              ('runtime', 'backend/deploy/Dockerfile', '.'),
              ('frontend', 'frontend/Dockerfile', 'frontend'),
              ('browser', 'backend/deploy/Dockerfile.browser', '.'),
              ('ocr', 'backend/deploy/Dockerfile.ocr', '.'),
          ]
          for name, dockerfile, context in entries:
              reference = registry + name + ':' + os.environ['GITHUB_SHA']
              # Keep build diagnostics private: application dependencies may
              # change their output. Emit only fixed phase names and digests.
              with (directory / ('build-' + name + '.log')).open('w') as log:
                  for arguments in [
                      ['docker', 'build', '--platform=linux/amd64', '--file', dockerfile, '--tag', reference, context],
                      ['docker', 'push', reference],
                  ]:
                      result = subprocess.run(arguments, stdout=log, stderr=subprocess.STDOUT, timeout=900)
                      if result.returncode:
                          sys.exit('::error::Container build or push failed for ' + name + '. Private logs retained until cleanup.')
              result = subprocess.run(['docker', 'image', 'inspect', reference, '--format', '{{json .RepoDigests}}'], capture_output=True, text=True, timeout=30)
              digests = json.loads(result.stdout) if result.returncode == 0 else []
              selected = next((x for x in digests if re.fullmatch(re.escape(registry + name) + r'@sha256:[a-f0-9]{64}', x)), None)
              if not selected:
                  sys.exit('::error::Immutable registry digest unavailable for ' + name + '.')
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('TENDERDESK_' + name.upper() + '_IMAGE=' + selected + '\n')
              print(json.dumps({'image': name, 'status': 'published', 'digest': selected.split('@')[1]}), flush=True)
          PY
      - name: Deploy private services and restore only the first Owner and configuration
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          APP_MODEL_GEMINI_KEY: ${{ secrets.APP_MODEL_GEMINI_KEY }}
          APP_MODEL_GEMINI_NAME: ${{ vars.APP_MODEL_GEMINI_NAME }}
          APP_MODEL_GEMINI_PROJECT: ${{ vars.APP_MODEL_GEMINI_PROJECT }}
          APP_MODEL_GROQ_KEY: ${{ secrets.APP_MODEL_GROQ_KEY }}
          APP_MODEL_QWEN_KEY: ${{ secrets.APP_MODEL_QWEN_KEY }}
          APP_MODEL_MISTRAL_KEY: ${{ secrets.APP_MODEL_MISTRAL_KEY }}
          APP_MODEL_ZAI_KEY: ${{ secrets.APP_MODEL_ZAI_KEY }}
          APP_MODEL_OPENAI_KEY: ${{ secrets.APP_MODEL_OPENAI_KEY }}
          APP_MODEL_CLAUDE_KEY: ${{ secrets.APP_MODEL_CLAUDE_KEY }}
          APP_MODEL_CLOUDFLARE_KEY: ${{ secrets.APP_MODEL_CLOUDFLARE_KEY }}
          APP_SMTP_HOST: ${{ secrets.APP_SMTP_HOST }}
          APP_SMTP_PORT: ${{ secrets.APP_SMTP_PORT }}
          APP_SMTP_USER: ${{ secrets.APP_SMTP_USER }}
          APP_SMTP_PASSWORD: ${{ secrets.APP_SMTP_PASSWORD }}
          APP_SMTP_FROM: ${{ secrets.APP_SMTP_FROM }}
          TENDERDESK_PUBLIC_ORIGIN: ${{ vars.TENDERDESK_PUBLIC_ORIGIN }}
        run: |
          python3 backend/scripts/ops/digitalocean-deploy.py \
            --bundle "${DOKS_WORKDIR}/migration.tar.gz" \
            --sha256 37de57604b2afc46d6363efa64cc70a8242c07c856f1b0659fa5496697818484
      - name: Verify public HTTPS and service boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 backend/scripts/ops/digitalocean-smoke.py
      - name: Remove runner credentials, private data and build logs
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / ('td-deploy-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          if directory.exists():
              shutil.rmtree(directory)
          print('Private runner data and credentials removed.')
          PY
