name: Snapshot approved assessment recovery
on:
  push:
    branches: [codex/snapshot-approved-recovery]
    paths: [.github/workflows/snapshot-assessment-recovery.yml]
permissions:
  contents: read
# Read-only snapshot deliberately does not acquire the production mutation mutex.
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Capture anonymous current assessment processing counts
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set +e
          python3 backend/scripts/ops/observe-assessment-recovery.py --timeout 10 --interval 10 --minimum-completed 1
          snapshot_status=$?
          set -e
          if [ "$snapshot_status" -eq 2 ]; then
            python3 -c 'import json; print(json.dumps({"assessment_snapshot":"captured","processing_still_pending":True}))'
            exit 0
          fi
          exit "$snapshot_status"
      - name: Remove temporary runner cluster credentials
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/('td-sources-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          if p.exists():shutil.rmtree(p)
          PY
