name: Synchronize provider credentials dynamically
on:
  workflow_dispatch:
    inputs:
      action:
        description: Credential sync or explicitly requested assessment recovery
        type: choice
        options: [sync, sample, remaining, status]
        default: sync
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main, codex/dynamic-provider-credentials]
    paths:
      - .github/workflows/sync-provider-credentials.yml
      - backend/scripts/ops/sync-provider-credentials.py
      - backend/scripts/ops/recover-model-assessments.py
      - backend/scripts/ops/test_sync_provider_credentials.py
      - backend/scripts/ops/test_recover_model_assessments.py
      - backend/scripts/ops/test_recover_model_assessments.mjs
      - backend/supabase/functions/_shared/modelProviders.ts
      - backend/supabase/functions/_shared/backend.ts
permissions:
  contents: read
concurrency:
  group: tenderdesk-digitalocean-production
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Validate changed operations and application packages
        if: github.event_name == 'push'
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          python3 -m pip install --requirement backend/scripts/ops/private-transfer-requirements.txt
          npm --prefix frontend run typecheck
          npm --prefix frontend test -- --maxWorkers=1
          npm --prefix frontend run build
          npm --prefix backend run typecheck
          npm --prefix backend test -- --maxWorkers=1
          npm --prefix backend run build
          python3 -m unittest discover -s backend/scripts/ops -p 'test_*.py'
      - name: Discover aliases and synchronize available bindings without logging values
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          PROVIDER_SECRET_BINDINGS: ${{ toJSON(secrets) }}
        run: python3 backend/scripts/ops/sync-provider-credentials.py
      - name: Recover one assessment with the existing saved task routes
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'sample'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          python3 backend/scripts/ops/recover-model-assessments.py --action sample --batch-id provider-runtime-20261029 --enable-task-routing
          python3 backend/scripts/ops/recover-model-assessments.py --action status --batch-id provider-runtime-20261029 --wait-seconds 420
          python3 backend/scripts/ops/recover-model-assessments.py --action remaining --batch-id provider-runtime-20261029
      - name: Recover remaining assessments after verified sample success
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'remaining'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/recover-model-assessments.py --action remaining --batch-id provider-runtime-20261029
      - name: Read assessment recovery progress
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'status'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/recover-model-assessments.py --action status --batch-id provider-runtime-20261029
      - name: Remove temporary cluster credentials
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/('td-sources-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          if p.exists():shutil.rmtree(p)
          PY
