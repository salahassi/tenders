name: Synchronize provider credentials dynamically
on:
  workflow_dispatch:
    inputs:
      action:
        description: Credential sync or explicitly requested assessment recovery
        type: choice
        options: [sync, sample, remaining, status]
        default: sync
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main, codex/dynamic-provider-credentials]
    paths:
      - .github/workflows/sync-provider-credentials.yml
      - backend/scripts/ops/sync-provider-credentials.py
      - backend/scripts/ops/recover-model-assessments.py
      - backend/scripts/ops/test_sync_provider_credentials.py
      - backend/scripts/ops/test_recover_model_assessments.py
      - backend/scripts/ops/test_recover_model_assessments.mjs
      - backend/supabase/functions/_shared/modelProviders.ts
      - backend/supabase/functions/_shared/backend.ts
permissions:
  contents: read
concurrency:
  group: tenderdesk-digitalocean-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Verify application packages and operation guards
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          python3 -m pip install --requirement backend/scripts/ops/private-transfer-requirements.txt
          npm --prefix frontend run typecheck
          npm --prefix frontend test -- --maxWorkers=1
          npm --prefix frontend run build
          npm --prefix backend run typecheck
          npm --prefix backend test -- --maxWorkers=1
          npm --prefix backend run build
          python3 -m unittest discover -s backend/scripts/ops -p 'test_*.py'
  discover:
    needs: verify
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      provider_aliases: ${{ steps.aliases.outputs.provider_aliases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Discover canonical and saved connection aliases
        id: aliases
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/sync-provider-credentials.py --action discover
  bind:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        alias: ${{ fromJSON(needs.discover.outputs.provider_aliases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Synchronize only the discovered provider binding
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          PROVIDER_ALIAS: ${{ matrix.alias }}
          PROVIDER_KEY_VALUE: ${{ secrets[matrix.alias] }}
          APPROVED_PROVIDER_ALIASES: ${{ needs.discover.outputs.provider_aliases }}
        run: python3 backend/scripts/ops/sync-provider-credentials.py --action apply
  reload:
    needs: [discover, bind]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refresh only stale API and worker processes and verify all runtime bindings
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/sync-provider-credentials.py --action reload
  recover:
    needs: reload
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'sync'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recover one assessment and gate the remaining batch on real success
        if: inputs.action == 'sample'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          python3 backend/scripts/ops/recover-model-assessments.py --action sample --batch-id provider-runtime-20261029 --enable-task-routing
          python3 backend/scripts/ops/recover-model-assessments.py --action status --batch-id provider-runtime-20261029 --wait-seconds 420
          python3 backend/scripts/ops/recover-model-assessments.py --action remaining --batch-id provider-runtime-20261029
      - name: Recover remaining assessments after verified sample success
        if: inputs.action == 'remaining'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/recover-model-assessments.py --action remaining --batch-id provider-runtime-20261029
      - name: Read assessment recovery progress
        if: inputs.action == 'status'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/recover-model-assessments.py --action status --batch-id provider-runtime-20261029
