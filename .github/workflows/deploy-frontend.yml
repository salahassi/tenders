name: Deploy TenderDesk frontend

on:
  workflow_dispatch:
  push:
    branches: [codex/pdf-worker-release, codex/workspace-history-release]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

concurrency:
  group: tenderdesk-digitalocean-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Verify application packages and frontend release guards
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          python3 -m pip install --requirement backend/scripts/ops/private-transfer-requirements.txt
          npm --prefix frontend run typecheck
          npm --prefix frontend test -- --maxWorkers=1
          npm --prefix frontend run build
          npm --prefix backend run typecheck
          npm --prefix backend test -- --maxWorkers=2
          npm --prefix backend run build
          # Provision the immutable fixture before its network-isolated tests.
          docker pull postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          python3 -m unittest discover -s backend/scripts/ops -p 'test_*.py'
      - name: Install Chromium for real PDF extraction acceptance
        run: backend/node_modules/.bin/playwright install --with-deps chromium
      - name: Reproduce the previous workspace boundary failure in an isolated build
        if: github.ref == 'refs/heads/codex/workspace-history-release'
        run: |
          baseline="$RUNNER_TEMP/workspace-history-baseline"
          mkdir -p "$baseline"
          git archive b997f2fc4aa01a3d7e6446233975c69f3b9a29d7 | tar -x -C "$baseline"
          cmp frontend/package-lock.json "$baseline/frontend/package-lock.json"
          cmp backend/package-lock.json "$baseline/backend/package-lock.json"
          ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$baseline/frontend/node_modules"
          ln -s "$GITHUB_WORKSPACE/backend/node_modules" "$baseline/backend/node_modules"
          npm --prefix "$baseline/frontend" run build
          TENDERDESK_BROWSER_DIST="$baseline/frontend/dist" node frontend/deploy/verify-workspace-boot.mjs --expect-boundary-failure
      - name: Verify workspace boot and paged history in Chromium with isolated fixtures
        run: node frontend/deploy/verify-workspace-boot.mjs
      - name: Save isolated workspace browser screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: workspace-browser-fixture
          path: ${{ runner.temp }}/tenderdesk-workspace-browser/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare verified cluster access and expiring registry credentials
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/digitalocean-runner.py
      - name: Build and publish only the frontend image
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          registry = 'registry.digitalocean.com/tenderdesk-a6093a76/frontend'
          revision = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[a-f0-9]{40}', revision):
              raise SystemExit('Frontend source revision is invalid.')
          reference = registry + ':' + revision
          directory = pathlib.Path(os.environ['DOKS_WORKDIR'])
          with (directory / 'build-frontend.log').open('w') as log:
              commands = [
                  ['docker', 'build', '--platform=linux/amd64', '--file', 'frontend/Dockerfile',
                   '--label', 'org.opencontainers.image.revision=' + revision, '--tag', reference, 'frontend'],
                  ['docker', 'push', reference],
              ]
              for command in commands:
                  if subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=900).returncode:
                      raise SystemExit('Frontend image build or publication failed.')
          result = subprocess.run(['docker', 'image', 'inspect', reference, '--format', '{{json .RepoDigests}}'],
                                  capture_output=True, text=True, timeout=30)
          values = json.loads(result.stdout) if result.returncode == 0 else []
          digest = next((value for value in values if re.fullmatch(re.escape(registry) + r'@sha256:[a-f0-9]{64}', value)), None)
          if not digest:
              raise SystemExit('Immutable frontend image digest is missing.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('TENDERDESK_FRONTEND_IMAGE=' + digest + '\n')
          print(json.dumps({'image': 'frontend', 'status': 'published', 'digest': digest.split('@')[1],
                            'source_revision': revision}), flush=True)
          PY
      - name: Update the frontend and verify hosted PDF extraction
        run: python3 backend/scripts/ops/digitalocean-update-frontend.py
      - name: Remove temporary runner credentials and build logs
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / ('td-deploy-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          if directory.exists():
              shutil.rmtree(directory)
          print('Temporary frontend release credentials and logs removed.')
          PY
