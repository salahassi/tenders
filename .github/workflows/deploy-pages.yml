name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "frontend/docs/**"
      - "backend/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install frontend locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Install backend locked dependencies
        working-directory: backend
        run: npm ci
      - name: Check frontend TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Check backend TypeScript
        working-directory: backend
        run: npm run typecheck
      - name: Check Edge Functions with Deno
        working-directory: backend
        run: npm exec --yes --package=deno@2.9.6 -- deno check --no-lock --config supabase/functions/deno.json supabase/functions/api/index.ts supabase/functions/worker/index.ts
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Run backend tests
        working-directory: backend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
