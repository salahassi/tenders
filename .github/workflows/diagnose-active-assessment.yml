name: Diagnose approved assessment runtime error
on:
  push:
    branches: [codex/diagnose-active-assessment]
    paths: [.github/workflows/diagnose-active-assessment.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read model, assessment and credential-presence metadata without invoking providers
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import importlib.util,sys,pathlib,os,json,hmac,shutil
          spec=importlib.util.spec_from_file_location('source_diagnosis','backend/scripts/ops/transfer-sources.py')
          s=importlib.util.module_from_spec(spec);sys.modules[spec.name]=s;spec.loader.exec_module(s)
          directory=None;pod=None;admin_secret=None
          try:
              directory=s.prepare_cluster();d=s.d
              deployments=json.loads(d.command(['get','deployments','-n',d.NAMESPACE,'-o','json']))['items']
              print(json.dumps({'workloads':[{'name':x['metadata']['name'],'ready':x['status'].get('readyReplicas',0)} for x in deployments]}))
              worker_logs=d.command(['logs','deployment/worker','-n',d.NAMESPACE,'--tail=200','--since=30m'])
              for line in worker_logs.splitlines():
                  if 'generation_handler_failed' not in line:continue
                  try:
                      item=json.loads(line[line.index('{'):])
                      safe={k:item[k] for k in ['phase','error_type','locations'] if k in item}
                      print(json.dumps({'generation_error':safe}))
                  except (ValueError,KeyError):pass
              native=json.loads(d.command(['get','cronjobs','-n',d.NAMESPACE,'-o','json']))['items']
              print(json.dumps({'native_schedules':[{'name':x['metadata']['name'],'suspended':x['spec'].get('suspend',False),'last_schedule':x.get('status',{}).get('lastScheduleTime'),'last_success':x.get('status',{}).get('lastSuccessfulTime')} for x in native]}))
              credentials,ca=d.probe.target_credentials(os.environ['DIGITALOCEAN_ACCESS_TOKEN'])
              if not hmac.compare_digest(d.decode_secret(d.get('secret','tenderdesk-core')).get('PGSSLCA',''),ca):raise ValueError('DATABASE_CA_MISMATCH')
              pod='migration-client-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
              admin_secret='readonly-diagnostic-'+os.environ['GITHUB_RUN_ID']
              d.put_secret(admin_secret,credentials)
              manifest={'apiVersion':'v1','kind':'Pod','metadata':d.metadata(pod),'spec':{
                'restartPolicy':'Never','activeDeadlineSeconds':180,'automountServiceAccountToken':False,
                'securityContext':{'runAsNonRoot':True,'runAsUser':999,'runAsGroup':999,'seccompProfile':{'type':'RuntimeDefault'}},
                'containers':[{'name':'postgres-client','image':d.probe.CLIENT_IMAGE,'command':['sleep','180'],
                  'envFrom':[{'secretRef':{'name':admin_secret}}],
                  'env':[{'name':'PGSSLMODE','value':'verify-full'},{'name':'PGSSLROOTCERT','value':'/run/db-ca/ca.crt'},{'name':'PGCONNECT_TIMEOUT','value':'15'}],
                  'securityContext':{'allowPrivilegeEscalation':False,'readOnlyRootFilesystem':True,'capabilities':{'drop':['ALL']}},
                  'resources':{'requests':{'cpu':'25m','memory':'32Mi'},'limits':{'cpu':'500m','memory':'256Mi'}},
                  'volumeMounts':[{'name':'database-ca','mountPath':'/run/db-ca','readOnly':True}]}],
                'volumes':[{'name':'database-ca','secret':{'secretName':'tenderdesk-core','defaultMode':292,'items':[{'key':'PGSSLCA','path':'ca.crt'}]}}]}}
              d.apply_managed([manifest])
              d.command(['wait','pod/'+pod,'-n',d.NAMESPACE,'--for=condition=Ready','--timeout=90s'],timeout=100)
              runtime=d.decode_secret(d.get('secret','tenderdesk-runtime'))
              print(json.dumps({'model_key_presence':{k:bool(v) for k,v in runtime.items() if k.startswith('APP_MODEL_') and k.endswith('_KEY')}}))
              query="""BEGIN READ ONLY; SET LOCAL ROLE tdp_app_owner;
              SELECT jsonb_build_object(
               'now',now(),
               'scope_inputs',(SELECT jsonb_agg(jsonb_build_object('policy_scope',p.frozen_context#>>'{discovery_scope_policy,scope}',
                'context_keys',(SELECT jsonb_agg(k) FROM jsonb_object_keys(p.frozen_context) k),
                'verified_company',(SELECT count(*) FROM jsonb_array_elements(coalesce(p.frozen_context->'knowledge','[]')) e WHERE e->>'kind'='company' AND e->>'verified'='true')))
                FROM public.generation_plans p WHERE p.status='blocked' AND p.error_code='MODEL_CORRECTION_EXHAUSTED'),
               'factor_shapes',(SELECT jsonb_agg(to_jsonb(x)) FROM (SELECT gr.result_key,f.key factor,f.value->'rating' rating,
                jsonb_array_length(coalesce(f.value->'notice_evidence','[]')) notice_refs,jsonb_array_length(coalesce(f.value->'company_evidence','[]')) company_refs,
                gr.value#>>'{result,scope_decision,status}' scope_status,
                jsonb_array_length(coalesce(gr.value#>'{result,scope_decision,keyword_evidence}','[]')) scope_keyword_refs
                FROM app_private.model_graph_results gr CROSS JOIN LATERAL jsonb_each(coalesce(gr.value#>'{result,factors}','{}')) f
                WHERE gr.result_key~'^candidate-[0-2]$' ORDER BY gr.created_at,f.key)x),

               'validation_artifacts',(SELECT jsonb_agg(to_jsonb(x)) FROM (SELECT r.result_key,r.created_at,r.content_hash,
                 r.value#>'{local_validation,diagnostics}' writer_diagnostics,r.value->'validation_diagnostics' repair_diagnostics,
                 r.value->>'code' artifact_code,r.value#>>'{local_validation,task}' local_task
                 FROM app_private.model_graph_results r WHERE r.value?'local_validation' OR r.value?'validation_diagnostics'
                 ORDER BY r.created_at DESC LIMIT 12)x),

               'queue',(SELECT jsonb_agg(to_jsonb(x)) FROM (SELECT type,status,error_code,count(*) FROM public.jobs GROUP BY type,status,error_code)x),
               'recent_jobs',(SELECT jsonb_agg(to_jsonb(x)) FROM (SELECT type,status,error_code,attempts,next_attempt_at,created_at,updated_at,
                 to_jsonb(j)->'executor_version' executor_version FROM public.jobs j WHERE type IN ('classify_opportunity','model_probe','analyze_chunk','review_proposal') ORDER BY updated_at DESC LIMIT 20)x),
               'attempts',(SELECT jsonb_agg(to_jsonb(x)) FROM (SELECT provider,model,operation,status,result_code,sent,http_status,provider_error_code,provider_error_type,provider_error_reason,finish_reason,request_phase,started_at,finished_at FROM public.model_attempts ORDER BY id DESC LIMIT 30)x),
               'attempt_summary',(SELECT jsonb_agg(to_jsonb(x)) FROM (SELECT provider,model,result_code,http_status,count(*) FROM public.model_attempts WHERE started_at>now()-interval '48 hours' GROUP BY provider,model,result_code,http_status)x),
               'connections',(SELECT jsonb_agg(jsonb_build_object('provider',provider,'credential_alias',credential_alias,'enabled',enabled,'revision',revision,'model_count',(SELECT count(*) FROM public.model_configurations m WHERE m.connection_id=c.id))) FROM public.model_connections c),
               'models',(SELECT jsonb_agg(jsonb_build_object('provider',c.provider,'model',m.model,'enabled',m.enabled,'capabilities',m.capabilities)) FROM public.model_configurations m JOIN public.model_connections c ON c.id=m.connection_id),
               'execution',(SELECT jsonb_agg(jsonb_build_object('enabled',enabled,'admitted_after',admitted_after,'revision',revision)) FROM public.model_execution_settings),
               'routes',(SELECT jsonb_agg(jsonb_build_object('task',task,'models',cardinality(model_ids),'inherit_default',inherit_default,'strategy',strategy,'profile',profile)) FROM public.model_task_routes),
               'legacy_routing',(SELECT jsonb_agg(to_jsonb(r)-ARRAY['id','workspace_id','created_by','restore_origin']) FROM public.model_routing r),
               'plans',(SELECT jsonb_agg(to_jsonb(x)) FROM (SELECT kind,stage,status,error_code,count(*) FROM public.generation_plans GROUP BY kind,stage,status,error_code)x),
               'operations',(SELECT jsonb_agg(jsonb_build_object('heartbeat',last_heartbeat_at,'scheduler_enabled',scheduler_enabled,'error_code',last_error_code)) FROM public.operations),
               'browser_requests',(SELECT jsonb_agg(to_jsonb(x)) FROM (SELECT status,error_code,count(*) FROM public.source_browser_requests GROUP BY status,error_code)x),
               'usage',(SELECT jsonb_agg(to_jsonb(x)) FROM (SELECT provider,state,error_code,count(*) FROM public.provider_usage GROUP BY provider,state,error_code)x)); COMMIT;"""
              print(d.sql(pod,query))
          except Exception as e:
              print(json.dumps({'diagnosis':'failed','type':type(e).__name__}));raise SystemExit(1)
          finally:
              for kind,name in [('pod',pod),('secret',admin_secret)]:
                  if not name:continue
                  item=s.d.get(kind,name)
                  if item is None:continue
                  if item.get('metadata',{}).get('labels',{}).get('app.kubernetes.io/managed-by')!='tenderdesk-deployment':raise ValueError('FOREIGN_DIAGNOSTIC_RESOURCE')
                  s.d.command(['delete',kind,name,'-n',s.d.NAMESPACE,'--wait=true','--timeout=60s'],timeout=75)
              print('{"readonly_diagnostic_resources":"removed"}')
              if directory:shutil.rmtree(directory)
          PY
      - name: Remove any temporary runner credentials
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/('td-sources-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          if p.exists():shutil.rmtree(p)
          PY
