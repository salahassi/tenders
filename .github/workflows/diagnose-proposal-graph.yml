name: Privately diagnose one retained proposal model graph
on:
  push:
    branches: [codex/ai-reliability-resume]
    paths:
      - .github/workflows/diagnose-proposal-graph.yml
      - backend/scripts/ops/proposal-graph-diagnostic.py
      - backend/scripts/ops/proposal-graph-diagnostic.sql
      - backend/scripts/ops/test_proposal_graph_diagnostic.py
      - backend/scripts/ops/test_proposal_graph_diagnostic.mjs
  workflow_dispatch:
    inputs:
      selection_object:
        description: Exact encrypted workspace, proposal plan, job and deployed runtime selection
        type: string
        required: true
      selection_sha256:
        description: Reviewed selection plaintext SHA-256
        type: string
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Check exact-job read-only graph diagnostic guards
        run: |
          npm ci --prefix backend
          python3 -m pip install --requirement backend/scripts/ops/private-transfer-requirements.txt
          python3 -m unittest discover -s backend/scripts/ops -p 'test_proposal_graph_diagnostic.py'
      - name: Read retained graph and invalid verifier artifacts into encrypted private report
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          PROPOSAL_SELECTION_OBJECT: ${{ inputs.selection_object }}
          PROPOSAL_SELECTION_SHA256: ${{ inputs.selection_sha256 }}
        run: |
          python3 backend/scripts/ops/proposal-graph-diagnostic.py \
            --selection-object "$PROPOSAL_SELECTION_OBJECT" \
            --selection-sha256 "$PROPOSAL_SELECTION_SHA256"
      - name: Remove temporary runner cluster credentials and private plaintext
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os,pathlib,re,shutil,sys
          try:
              run,attempt=os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT']
              if not re.fullmatch(r'[0-9]{1,20}',run) or not re.fullmatch(r'[0-9]{1,6}',attempt):raise ValueError()
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/('td-sources-'+run+'-'+attempt)
              if path.exists():shutil.rmtree(path)
          except Exception:
              print('{"proposal_graph_diagnostic":"failed","code":"RUNNER_CLEANUP_NOT_CONFIRMED"}')
              sys.exit(1)
          print('{"proposal_graph_diagnostic":"runner_files_removed"}')
          PY
