name: Release reviewed AI execution reliability fixes

on:
  workflow_dispatch:
  push:
    branches: [codex/ai-execution-reliability]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

concurrency:
  group: tenderdesk-digitalocean-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Verify locked packages and release guards before accessing production
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          python3 -m pip install --requirement backend/scripts/ops/private-transfer-requirements.txt
          npm --prefix frontend run typecheck
          npm --prefix frontend test -- --maxWorkers=1
          npm --prefix frontend run build
          npm --prefix backend run typecheck
          npm --prefix backend test -- --maxWorkers=1
          npm --prefix backend run build
          python3 -m unittest discover -s backend/scripts/ops -p 'test_*.py'
          python3 -m unittest discover -s backend/deploy/kubernetes -p 'test_*.py'
      - name: Prepare verified cluster access and expiring image credentials
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/digitalocean-runner.py
      - name: Build the immutable API and worker runtime
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          registry='registry.digitalocean.com/tenderdesk-a6093a76/runtime'
          reference=registry+':'+os.environ['GITHUB_SHA']
          directory=pathlib.Path(os.environ['DOKS_WORKDIR'])
          with (directory/'ai-runtime-build.log').open('w') as log:
              for command in [['docker','build','--platform=linux/amd64','--file','backend/deploy/Dockerfile','--tag',reference,'.'],['docker','push',reference]]:
                  if subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=900).returncode:
                      raise SystemExit('AI runtime image build or push failed.')
          result=subprocess.run(['docker','image','inspect',reference,'--format','{{json .RepoDigests}}'],capture_output=True,text=True,timeout=30)
          values=json.loads(result.stdout) if result.returncode==0 else []
          digest=next((value for value in values if re.fullmatch(re.escape(registry)+r'@sha256:[a-f0-9]{64}',value)),None)
          if not digest:raise SystemExit('Immutable AI runtime digest missing.')
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('TENDERDESK_RUNTIME_IMAGE='+digest+'\n')
          print(json.dumps({'image':'runtime','status':'published','digest':digest.split('@')[1]}))
          PY
      - name: Apply exact function migrations and update only API and worker
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/ai-reliability-update.py
      - name: Remove runner credentials and private build logs
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PY'
          import os,pathlib,re,shutil
          run,attempt=os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT']
          if not re.fullmatch(r'[0-9]{1,20}',run) or not re.fullmatch(r'[0-9]{1,6}',attempt):
              raise SystemExit('Runner cleanup identity invalid.')
          for prefix in ('td-deploy-', 'td-sources-'):
              directory=pathlib.Path(os.environ['RUNNER_TEMP'])/(prefix+run+'-'+attempt)
              if directory.exists():shutil.rmtree(directory)
          print('Temporary AI release credentials and logs removed.')
          PY
