name: Collect JavaScript sources
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: source-browser-production
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci
      - name: Verify runner browser
        run: google-chrome --version
      - name: Install bounded public document OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          tesseract --version
          tesseract --list-langs
      - name: Read public pages and handle requested human verification
        working-directory: backend
        env:
          SOURCE_BROWSER_CHANNEL: chrome
        run: node --experimental-transform-types scripts/backend/browser-source-worker.ts
