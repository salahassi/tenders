name: Verify saved proposal recovery
on:
  push:
    branches: [fix/saved-proposal-recovery]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Backend TypeScript
        run: npm run typecheck
        working-directory: backend
      - name: Frontend TypeScript
        run: npm run typecheck
        working-directory: frontend
      - name: Recovery regression tests
        run: npm test -- --maxWorkers=1 tests/backend/generation.test.ts
        working-directory: backend
      - name: Frontend regression tests
        run: npm test -- --maxWorkers=2
        working-directory: frontend
      - name: Full backend regression tests
        run: npm test -- --maxWorkers=1
        working-directory: backend
      - name: Backend build
        run: npm run build
        working-directory: backend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend
