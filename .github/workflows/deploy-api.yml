name: Deploy Supabase API and worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is unavailable. Add it in repository Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
      - name: Check both packages
        run: |
          npm --prefix frontend run typecheck
          npm --prefix backend run typecheck
          npm --prefix frontend test -- --maxWorkers=2
          npm --prefix backend test -- --maxWorkers=1
          npm --prefix frontend run build
          npm --prefix backend run build
      - name: Check Edge Function imports
        working-directory: backend
        run: npm exec --yes --package=deno@2.9.6 -- deno check --no-lock --config supabase/functions/deno.json supabase/functions/api/index.ts supabase/functions/worker/index.ts
      - name: Deploy canonical API and worker files
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --no-install supabase functions deploy api --project-ref nqfwbqeozmuiuwbiowil --import-map supabase/functions/deno.json --no-verify-jwt --use-api
          npx --no-install supabase functions deploy worker --project-ref nqfwbqeozmuiuwbiowil --import-map supabase/functions/deno.json --no-verify-jwt --use-api
      - name: Verify API health, preflight, and anonymous denial
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "https://nqfwbqeozmuiuwbiowil.supabase.co/functions/v1/api/v1"
          origin = "https://salahassi.github.io"
          checks = [
              ("GET", "/health", 200, {}),
              ("OPTIONS", "/bootstrap", 204, {
                  "Access-Control-Request-Method": "GET",
                  "Access-Control-Request-Headers": "authorization,content-type",
              }),
              ("GET", "/bootstrap", 401, {}),
          ]
          for attempt in range(5):
              try:
                  for method, path, expected, extra in checks:
                      request = urllib.request.Request(
                          base + path, method=method,
                          headers={"Origin": origin, **extra},
                      )
                      try:
                          response = urllib.request.urlopen(request, timeout=20)
                      except urllib.error.HTTPError as error:
                          response = error
                      with response:
                          body = response.read()
                          if response.status != expected:
                              raise RuntimeError(f"{method} {path}: expected {expected}, received {response.status}")
                          if response.headers.get("Access-Control-Allow-Origin") != origin:
                              raise RuntimeError(f"{method} {path}: application CORS header missing")
                          if method == "OPTIONS":
                              allowed = {h.strip().lower() for h in response.headers.get("Access-Control-Allow-Headers", "").split(",")}
                              if not {"authorization", "content-type"} <= allowed:
                                  raise RuntimeError("Bootstrap preflight does not allow required headers")
                          else:
                              payload = json.loads(body)
                              if path == "/health" and payload.get("data", {}).get("status") != "available":
                                  raise RuntimeError("API health response is invalid")
                              if path == "/bootstrap" and payload.get("error", {}).get("code") != "UNAUTHENTICATED":
                                  raise RuntimeError("Anonymous API access was not denied by the application")
                      print(f"{method} {path}: {expected} verified")
                  request = urllib.request.Request(base.rsplit("/api/v1", 1)[0] + "/worker", method="POST", data=b"{}", headers={"Content-Type": "application/json"})
                  try:
                      urllib.request.urlopen(request, timeout=20)
                      raise RuntimeError("Anonymous worker request was accepted")
                  except urllib.error.HTTPError as error:
                      if error.code != 401 or json.loads(error.read()).get("error") != "UNAUTHORIZED":
                          raise RuntimeError("Worker did not enforce its secret")
                  print("POST worker: 401 verified")
                  break
              except (OSError, RuntimeError, ValueError) as error:
                  if attempt == 4:
                      raise
                  print(f"Waiting for deployed API: {error}")
                  time.sleep(3)
          PY
