name: Complete job summary pagination

on:
  workflow_dispatch:
    inputs:
      diagnose_promotion:
        description: Registry-read-only local promotion inspection; no rollout
        type: boolean
        required: true
        default: false
      reuse_verified_packages:
        description: Require the recorded application and operations gates and exact unchanged application sources
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: tenderdesk-digitalocean-production
  cancel-in-progress: false

jobs:
  inspect-promotion:
    if: ${{ inputs.diagnose_promotion == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the exact published image and local promotion metadata
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/runtime-promotion-inspection.py
  release:
    if: ${{ inputs.diagnose_promotion != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require recorded checks for the bounded completion
        if: ${{ inputs.reuse_verified_packages != true }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Verify recorded gates, unchanged artifacts and current release checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 backend/scripts/ops/job-summary-verified-packages.py
          python3 backend/scripts/ops/proposal-delivery-release.py
          npm ci --prefix backend
          python3 -m pip install --quiet --disable-pip-version-check --requirement backend/scripts/ops/private-transfer-requirements.txt
          python3 -m unittest discover -s backend/scripts/ops -p 'test_digitalocean_update_frontend.py'
          python3 -m unittest discover -s backend/scripts/ops -p 'test_frontend_image_assets.py'
          python3 -m unittest discover -s backend/scripts/ops -p 'test_job_summary_release.py'
          python3 -m unittest discover -s backend/scripts/ops -p 'test_job_summary_verified_packages.py'
          node --check frontend/deploy/verify-pdf-worker.mjs
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          "$browser" --version
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
      - name: Prepare original-CA cluster access and temporary image credentials
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/digitalocean-runner.py
      - name: Pull the already verified immutable images without rebuilding or publishing
        run: python3 backend/scripts/ops/job-summary-release.py --prepare-completion
      - name: Complete only frontend and verify authenticated job summaries
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: python3 backend/scripts/ops/job-summary-release.py --frontend-only
      - name: Remove only this release attempt's owned temporary database client
        if: ${{ always() }}
        run: |
          if [ -n "${DOKS_WORKDIR:-}" ] && [ -x "${KUBECTL:-}" ]; then
            python3 backend/scripts/ops/proposal-delivery-update.py --cleanup
          fi
      - name: Remove private runner credentials and build logs
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os,pathlib,re,shutil
          run,attempt=os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT']
          if not re.fullmatch(r'[0-9]{1,20}',run) or not re.fullmatch(r'[0-9]{1,6}',attempt):
              raise SystemExit('Runner cleanup identity invalid.')
          directory=pathlib.Path(os.environ['RUNNER_TEMP'])/('td-deploy-'+run+'-'+attempt)
          if directory.exists():shutil.rmtree(directory)
          print('Temporary proposal release credentials and logs removed.')
          PY
